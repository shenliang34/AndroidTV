name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APKs
        run: ./gradlew :phone-app:assembleDebug :tv-app:assembleDebug

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp phone-app/build/outputs/apk/debug/phone-app-debug.apk "release-assets/Familia-Phone-${GITHUB_REF_NAME#v}.apk"
          cp tv-app/build/outputs/apk/debug/tv-app-debug.apk "release-assets/Familia-TV-${GITHUB_REF_NAME#v}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*.apk
